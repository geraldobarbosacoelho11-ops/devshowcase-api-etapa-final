spring.application.name=devshowcase

# Banco PostgreSQL. A senha fica no arquivo local ignorado pelo Git.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devshowcase}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Em desenvolvimento, o Hibernate cria/atualiza as tabelas automaticamente.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
server.error.include-message=always

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
